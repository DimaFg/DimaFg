# Local и одиночный VPS: Caddy (TLS) → web (Next.js) и api (FastAPI); worker; PostgreSQL.
# Наружу публикуются только 80/443 Caddy. PostgreSQL, api и worker доступны лишь во внутренней сети.
name: photo-site

# Общие настройки процессов: init пересылает сигналы и собирает зомби-процессы,
# ротация json-логов не даёт им заполнить диск VPS.
x-runtime: &runtime
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-photo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-photo}
  APP_SECRET: ${APP_SECRET:?set APP_SECRET}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://cdn.example.com}
  PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-2026-10-draft}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-}
  NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
  ADMIN_BASE_URL: ${SITE_URL:-http://localhost}/admin
  OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
  OUTBOX_RETRY_BASE_SECONDS: ${OUTBOX_RETRY_BASE_SECONDS:-30}
  OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-3600}
  OUTBOX_LOCK_TIMEOUT_SECONDS: ${OUTBOX_LOCK_TIMEOUT_SECONDS:-600}

services:
  db:
    <<: *runtime
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-photo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photo}"]
      interval: 5s
      retries: 10

  # Миграции выполняются один раз перед запуском новой версии, а не каждым worker-процессом.
  migrate:
    <<: *runtime
    build: ./api
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *runtime
    build: ./api
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    # БД доступна и её ревизия совпадает с миграциями в образе.
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "healthcheck", "--service", "api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    <<: *runtime
    build: ./api
    command: ["python", "-m", "app.cli", "worker"]
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Плюс свежесть heartbeat: зависший цикл обработки делает контейнер unhealthy.
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "healthcheck", "--service", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    <<: *runtime
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost}
        NEXT_PUBLIC_SITE_ENV: ${ENVIRONMENT:-local}
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
        NEXT_PUBLIC_TELEGRAM_HANDLE: ${TELEGRAM_HANDLE:-}
        NEXT_PUBLIC_TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL:-}
        NEXT_PUBLIC_PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-2026-10-draft}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000

  caddy:
    <<: *runtime
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
